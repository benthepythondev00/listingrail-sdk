[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "listingrail"
version = "0.1.0"
description = "Python client for the Listingrail real estate listings API: sale and rental listings from 22 property portals in one JSON shape."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Listingrail", email = "hello@listingrail.com" }]
keywords = ["real estate", "listings", "rental", "property", "api", "zillow", "rightmove", "idealista"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://listingrail.com"
Documentation = "https://listingrail.com/docs/"
Repository = "https://github.com/benthepythondev00/listingrail-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/listingrail"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real API without a key (set LISTINGRAIL_LIVE=1 to run)"]
